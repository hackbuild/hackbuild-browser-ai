name: ci
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  house-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      # hackbuild-ui is vendored pinned by commit (its tools/pin-ui.mjs writes the pin); the tarball,
      # its sha-256, SHA256SUMS, package.json and the lockfile must all match tools/vendor/hackbuild-ui.pin
      - run: node tools/vendor/pin-ui.mjs --check
      - run: npm ci
      # the ai-elements shadow sheet must be what the vendored class layer generates
      - run: node tools/gen-hb-sheet.mjs --check
      - run: node --test tools/test/*.test.mjs
      - run: git ls-files -z | grep -zEv '\.(png|jpe?g|gif|webp|glb|gltf|bin|wasm|onnx|wav|ico|woff2?|ttf)$|^(LICENSES/|RULES.md|CLAUDE.md|tools/)|package-lock.json|Cargo.lock' | xargs -0 node tools/lint-voice.mjs
      - run: node tools/lint-authors.mjs
      - run: node tools/lint-commits.mjs
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run typecheck
      - run: npx vitest run --reporter=default --reporter=json --outputFile.json=.local/vitest.json
      # every test that did not run is named in the job summary, so a skip never reads as a pass
      - run: node tools/test-summary.mjs .local/vitest.json
        if: ${{ !cancelled() }}
      - run: node --test tools/test/*.test.mjs
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      - run: npm ci
      # the wasm cores are committed (the wasm job checks their bytes), so no rust here
      - run: npm run build --if-present
      # pack each package; files allowlist, publint, attw, peers, size budget and README tables
      - run: node tools/lint-packages.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: tarballs
          path: .pack/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: tarballs
          path: .pack
      # every single file build loads from file:// in headless chrome with no network
      - run: node tools/check-browser.mjs
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins 1.95.0 with the wasm32 target; rustup installs it on first use
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install
      # the committed wasm and its base64 must be what this source builds to under the pinned rustc
      - run: node tools/build-wasm.mjs --all
      - run: git diff --stat --exit-code -- 'packages/*/wasm/*.wasm' 'packages/*/src/inline.ts'
